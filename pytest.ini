[pytest]
testpaths = tests
addopts = -ra --strict-markers --tb=short --junitxml=reports/junit.xml
markers =
    smoke: critical path checks
    regression: full suite
    auth: login and signup
    catalog: listing and search
    cart: cart operations
    checkout: address, payment and order
    ui: navigation and layout
filterwarnings =
    ignore::DeprecationWarning
