[pytest]
testpaths = tests
addopts = -ra --strict-markers --tb=short --html=reports/report.html --self-contained-html --junitxml=reports/junit.xml --screenshot only-on-failure --full-page-screenshot --video retain-on-failure --output reports/artifacts
markers =
    smoke: critical path checks
    regression: full suite
    auth: login and signup
    catalog: listing and search
    cart: cart operations
    checkout: address, payment and order
    ui: navigation and layout
filterwarnings =
    ignore::DeprecationWarning
